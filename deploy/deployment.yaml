apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          # Credentials and endpoints (Elastic, Dash0/OTLP, LLM) live in Secret
          # kubepulse-secrets, created outside git. Optional, so the pod still
          # starts (with telemetry and integrations off) before it exists.
          envFrom:
            - secretRef:
                name: kubepulse-secrets
                optional: true
          env:
            - name: TEAM_NAME
              value: "kubepulse"
            - name: DEMO_MODE
              value: "true"
            # Room occupancy is a live gauge: export metrics every 15s, not every 60s.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
