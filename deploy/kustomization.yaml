# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-kubepulse
resources:
  - deployment.yaml
  - service.yaml
  - service-peers.yaml
  - httproute.yaml
  - pdb.yaml
images:
  - name: app
    newName: ghcr.io/cifuentescossio/kubepulse
    newTag: c78b4a0
